<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criptografía clásica y criptoanálisis</title><link rel="stylesheet" href="assets/lab.css"></head><body><main class="shell" id="app"></main><script src="assets/lab.js"></script><script>
const {nav,footer,$,setStatus,escapeHtml}=Lab;document.querySelector('#app').innerHTML=nav()+`<section class="hero"><div class="eyebrow">Módulo 1</div><h1>Criptografía clásica y criptoanálisis</h1><p>Experimentá con sustitución monoalfabética, claves repetidas y análisis estadístico. El objetivo no es proteger información real, sino comprender cómo nace la tensión entre diseño y ataque.</p></section><section class="grid"><article class="card"><h2>Cifrado César</h2><div class="controls"><div class="control full"><label>Texto</label><textarea id="caesarText">LA CRIPTOGRAFIA TRANSFORMA UN MENSAJE</textarea></div><div class="control"><label>Desplazamiento</label><input id="shift" type="number" min="0" max="25" value="3"></div><div class="control"><label>Operación</label><select id="caesarMode"><option value="enc">Cifrar</option><option value="dec">Descifrar</option></select></div></div><div class="actions"><button id="runCaesar">Ejecutar</button><button class="secondary" id="swapCaesar">Usar salida como entrada</button></div><div class="output mono" id="caesarOut"></div><div class="status" id="caesarStatus">Observá cómo una sola clave desplaza todo el alfabeto.</div></article><article class="card"><h2>Cifrado de Vigenère</h2><div class="controls"><div class="control full"><label>Texto</label><textarea id="vigText">LA SEGURIDAD DEPENDE TAMBIEN DE LA CLAVE</textarea></div><div class="control"><label>Clave alfabética</label><input id="vigKey" value="CLAVE"></div><div class="control"><label>Operación</label><select id="vigMode"><option value="enc">Cifrar</option><option value="dec">Descifrar</option></select></div></div><div class="actions"><button id="runVig">Ejecutar</button><button class="secondary" id="swapVig">Usar salida como entrada</button></div><div class="output mono" id="vigOut"></div><div class="status" id="vigStatus">La clave repetida genera varios alfabetos de sustitución.</div></article><article class="card full"><h2>Análisis de frecuencias</h2><p class="muted">Pegá un texto cifrado y compará la distribución de letras. En idiomas naturales, las frecuencias no son uniformes; esa estructura filtra información.</p><div class="control"><label>Texto para analizar</label><textarea id="freqText">HVWH HV XQ PHQVDMH GH SUXHED SDUD DQDOLVLV</textarea></div><div class="actions"><button id="analyze">Calcular frecuencias</button><button class="secondary" id="loadCaesar">Analizar salida César</button></div><div class="bars" id="bars"></div><div class="metric-grid" style="margin-top:34px"><div class="metric"><strong id="letters">0</strong><span>Letras analizadas</span></div><div class="metric"><strong id="ioc">0</strong><span>Índice de coincidencia</span></div><div class="metric"><strong id="topLetter">—</strong><span>Letra más frecuente</span></div><div class="metric"><strong id="topPct">0%</strong><span>Frecuencia máxima</span></div></div></article><article class="card full"><h2>Ataque por fuerza bruta a César</h2><p class="muted">Se prueban los 26 desplazamientos y se ordenan mediante una medida de distancia respecto de frecuencias aproximadas del español.</p><div class="control"><label>Criptograma</label><textarea id="attackText">OD FULSWRJUDILD QR HV PDJLD</textarea></div><div class="actions"><button id="attack">Probar todas las claves</button></div><div class="table-wrap" style="margin-top:14px"><table><thead><tr><th>Posición</th><th>Clave</th><th>Puntaje</th><th>Texto candidato</th></tr></thead><tbody id="attackRows"></tbody></table></div></article><article class="card"><h2>Desafío</h2><ol class="steps"><li>Cifrá un párrafo de al menos 150 letras con César.</li><li>Compará su histograma con el texto original.</li><li>Ejecutá el ataque y justificá por qué el mejor candidato aparece arriba.</li><li>Repetí con Vigenère y explicá por qué el ataque simple deja de ser suficiente.</li></ol></article><article class="card"><h2>Lectura crítica</h2><div class="callout">La historia de la criptografía muestra una regularidad: ocultar el algoritmo no reemplaza una clave robusta, un espacio de claves suficiente ni un modelo de amenaza explícito.</div><p class="muted">El alfabeto didáctico utilizado es A–Z. Se preservan espacios y signos, pero se normalizan tildes.</p></article></section>`+footer();
const ABC='ABCDEFGHIJKLMNOPQRSTUVWXYZ';const normalize=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
function caesar(text,k,dec=false){k=((+k%26)+26)%26;if(dec)k=26-k;return normalize(text).replace(/[A-Z]/g,c=>ABC[(ABC.indexOf(c)+k)%26])}
function vigenere(text,key,dec=false){key=normalize(key).replace(/[^A-Z]/g,'');if(!key)return'';let j=0;return normalize(text).replace(/[A-Z]/g,c=>{const k=ABC.indexOf(key[j++%key.length]);return ABC[(ABC.indexOf(c)+(dec?-k:k)+26)%26]})}
$('#runCaesar').onclick=()=>{const out=caesar($('#caesarText').value,$('#shift').value,$('#caesarMode').value==='dec');$('#caesarOut').textContent=out;setStatus($('#caesarStatus'),`Se aplicó un desplazamiento de ${$('#shift').value}. La longitud del mensaje no cambia.`,'good')};
$('#swapCaesar').onclick=()=>{$('#caesarText').value=$('#caesarOut').textContent;$('#caesarMode').value=$('#caesarMode').value==='enc'?'dec':'enc'};
$('#runVig').onclick=()=>{if(!normalize($('#vigKey').value).match(/[A-Z]/)){setStatus($('#vigStatus'),'Ingresá una clave alfabética.','bad');return}const out=vigenere($('#vigText').value,$('#vigKey').value,$('#vigMode').value==='dec');$('#vigOut').textContent=out;setStatus($('#vigStatus'),`La clave tiene ${normalize($('#vigKey').value).replace(/[^A-Z]/g,'').length} posiciones antes de repetirse.`,'good')};
$('#swapVig').onclick=()=>{$('#vigText').value=$('#vigOut').textContent;$('#vigMode').value=$('#vigMode').value==='enc'?'dec':'enc'};
function frequencies(text){const clean=normalize(text).replace(/[^A-Z]/g,''),f=Object.fromEntries([...ABC].map(c=>[c,0]));for(const c of clean)f[c]++;return{clean,f}}
function renderFreq(){const {clean,f}=frequencies($('#freqText').value),n=clean.length,max=Math.max(1,...Object.values(f));$('#bars').innerHTML=[...ABC].map(c=>`<div class="bar" title="${c}: ${f[c]}" style="height:${Math.max(2,f[c]/max*100)}%"><span>${c}</span></div>`).join('');const top=[...ABC].sort((a,b)=>f[b]-f[a])[0];const ioc=n>1?Object.values(f).reduce((s,x)=>s+x*(x-1),0)/(n*(n-1)):0;$('#letters').textContent=n;$('#ioc').textContent=ioc.toFixed(4);$('#topLetter').textContent=top||'—';$('#topPct').textContent=n?`${(100*f[top]/n).toFixed(1)}%`:'0%'}
$('#analyze').onclick=renderFreq;$('#loadCaesar').onclick=()=>{$('#freqText').value=$('#caesarOut').textContent;renderFreq()};
const ES={A:12.53,B:1.42,C:4.68,D:5.86,E:13.68,F:.69,G:1.01,H:.70,I:6.25,J:.44,K:.02,L:4.97,M:3.15,N:6.71,O:8.68,P:2.51,Q:.88,R:6.87,S:7.98,T:4.63,U:3.93,V:.90,W:.01,X:.22,Y:.90,Z:.52};
function score(text){const {clean,f}=frequencies(text),n=clean.length||1;return[...ABC].reduce((s,c)=>s+Math.pow(f[c]/n*100-ES[c],2)/(ES[c]||.01),0)}
$('#attack').onclick=()=>{const rows=[...Array(26)].map((_,k)=>{const text=caesar($('#attackText').value,k,true);return{k,text,score:score(text)}}).sort((a,b)=>a.score-b.score);$('#attackRows').innerHTML=rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.k}</td><td>${r.score.toFixed(2)}</td><td class="mono">${escapeHtml(r.text)}</td></tr>`).join('')};renderFreq();$('#runCaesar').click();$('#runVig').click();
</script></body></html>
