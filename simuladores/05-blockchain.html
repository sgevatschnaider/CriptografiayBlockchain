<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criptografía y blockchain</title><link rel="stylesheet" href="assets/lab.css"></head><body><main class="shell" id="app"></main><script src="assets/lab.js"></script><script>
const {nav,footer,$,sha256,setStatus,escapeHtml}=Lab;$('#app').innerHTML=nav()+`<section class="hero"><div class="eyebrow">Módulo 5</div><h1>Criptografía y blockchain</h1><p>Construí una cadena de bloques, ejecutá una prueba de trabajo, manipulá datos y verificá cómo hashes y referencias enlazan el historial. Después calculá una raíz de Merkle.</p></section><section class="grid"><article class="card full"><h2>Cadena de bloques didáctica</h2><div class="controls"><div class="control full"><label>Datos del nuevo bloque</label><textarea id="blockData">Alice transfiere 3 unidades a Bob</textarea></div><div class="control"><label>Dificultad</label><select id="difficulty"><option value="1">1 cero</option><option value="2" selected>2 ceros</option><option value="3">3 ceros</option><option value="4">4 ceros</option></select></div><div class="control"><label>Estado</label><div class="output" id="mineProgress">Listo para minar.</div></div></div><div class="actions"><button id="addBlock">Minar y agregar</button><button class="secondary" id="validate">Validar cadena</button><button class="danger" id="tamper">Alterar bloque 1</button><button class="secondary" id="reset">Reiniciar</button></div><div id="chain" style="margin-top:16px"></div><div class="status" id="chainStatus">Cada bloque incorpora el hash del anterior.</div></article><article class="card full"><h2>Árbol de Merkle</h2><p class="muted">Cada línea se trata como una transacción. Los hashes se combinan por pares hasta obtener una raíz que compromete todo el conjunto.</p><div class="control"><label>Transacciones</label><textarea id="transactions">TX1: Alice → Bob 3
TX2: Bob → Carol 1
TX3: Carol → Dave 0.5
TX4: Dave → Alice 0.2</textarea></div><div class="actions"><button id="buildMerkle">Construir árbol</button><button class="danger" id="changeTx">Modificar una transacción</button></div><div class="output mono" id="merkleOut"></div><div class="metric-grid" style="margin-top:14px"><div class="metric"><strong id="leafCount">0</strong><span>hojas</span></div><div class="metric"><strong id="levelCount">0</strong><span>niveles</span></div><div class="metric"><strong id="rootShort">—</strong><span>raíz abreviada</span></div><div class="metric"><strong id="proofDepth">0</strong><span>profundidad de prueba</span></div></div><div class="status" id="merkleStatus">Una mínima modificación produce una raíz distinta.</div></article><article class="card"><h2>Qué aporta cada componente</h2><div class="table-wrap"><table><thead><tr><th>Componente</th><th>Función</th></tr></thead><tbody><tr><td>Hash</td><td>Identifica contenido y evidencia modificaciones.</td></tr><tr><td>Enlace previo</td><td>Ordena bloques y propaga cambios hacia adelante.</td></tr><tr><td>Proof‑of‑Work</td><td>Hace costosa la propuesta de historial.</td></tr><tr><td>Merkle tree</td><td>Permite comprometer muchas transacciones y probar inclusión.</td></tr><tr><td>Firma</td><td>Autoriza operaciones; no se simula como consenso.</td></tr></tbody></table></div></article><article class="card"><h2>Desafío</h2><ol class="steps"><li>Agregá tres bloques y validá la cadena.</li><li>Alterá el bloque 1 y explicá qué verificaciones fallan.</li><li>Compará la raíz de Merkle antes y después de cambiar una transacción.</li><li>Explicá por qué una blockchain no vuelve verdaderos los datos externos.</li></ol></article></section>`+footer();
let chain=[];async function hashBlock(b){return sha256(`${b.index}|${b.timestamp}|${b.data}|${b.previousHash}|${b.nonce}`)}
async function mineBlock(data,difficulty){const prev=chain.length?chain.at(-1).hash:'0'.repeat(64),b={index:chain.length,timestamp:new Date().toISOString(),data,previousHash:prev,nonce:0,hash:''},target='0'.repeat(difficulty);let start=performance.now();while(true){b.hash=await hashBlock(b);if(b.hash.startsWith(target))break;b.nonce++;if(b.nonce%250===0){$('#mineProgress').textContent=`Probando nonce ${b.nonce.toLocaleString()}…`;await new Promise(r=>setTimeout(r,0))}}$('#mineProgress').textContent=`Encontrado en ${b.nonce.toLocaleString()} intentos · ${(performance.now()-start).toFixed(0)} ms`;return b}
function renderChain(){if(!chain.length){$('#chain').innerHTML='<div class="output">Cadena vacía.</div>';return}$('#chain').innerHTML=chain.map(b=>`<article class="output" style="margin-bottom:10px"><b>Bloque ${b.index}</b> · nonce ${b.nonce}<br><span class="muted">${escapeHtml(b.timestamp)}</span><br><b>Datos:</b> ${escapeHtml(b.data)}<br><b>Previo:</b> <span class="mono">${b.previousHash.slice(0,24)}…</span><br><b>Hash:</b> <span class="mono">${b.hash.slice(0,34)}…</span></article>`).join('')}
async function init(){chain=[];chain.push(await mineBlock('Bloque génesis',1));renderChain();$('#mineProgress').textContent='Cadena inicializada.'}
$('#addBlock').onclick=async()=>{const btn=$('#addBlock');btn.disabled=true;try{chain.push(await mineBlock($('#blockData').value,+$('#difficulty').value));renderChain();setStatus($('#chainStatus'),'Bloque agregado y enlazado con el hash anterior.','good')}finally{btn.disabled=false}};
$('#validate').onclick=async()=>{let ok=true,reason='';for(let i=0;i<chain.length;i++){const expected=await hashBlock(chain[i]);if(expected!==chain[i].hash){ok=false;reason=`El hash del bloque ${i} no corresponde a su contenido.`;break}if(i>0&&chain[i].previousHash!==chain[i-1].hash){ok=false;reason=`El bloque ${i} no referencia correctamente al anterior.`;break}}setStatus($('#chainStatus'),ok?'Cadena válida: hashes y enlaces son consistentes.':`Cadena inválida: ${reason}`,ok?'good':'bad')};
$('#tamper').onclick=()=>{if(chain.length<2){setStatus($('#chainStatus'),'Agregá al menos un bloque después del génesis.','warn');return}chain[1].data+=' [ALTERADO]';renderChain();setStatus($('#chainStatus'),'Se modificó el contenido sin recalcular hashes. Ejecutá la validación.','warn')};$('#reset').onclick=init;
async function merkle(lines){let level=await Promise.all(lines.map(x=>sha256(x))),levels=[level];while(level.length>1){if(level.length%2)level.push(level.at(-1));const next=[];for(let i=0;i<level.length;i+=2)next.push(await sha256(level[i]+level[i+1]));level=next;levels.push(level)}return levels}
async function buildMerkle(){const tx=$('#transactions').value.split(/\n+/).map(s=>s.trim()).filter(Boolean);if(!tx.length){setStatus($('#merkleStatus'),'Ingresá al menos una transacción.','bad');return}const levels=await merkle(tx),root=levels.at(-1)[0];$('#leafCount').textContent=tx.length;$('#levelCount').textContent=levels.length;$('#rootShort').textContent=root.slice(0,12)+'…';$('#proofDepth').textContent=Math.ceil(Math.log2(tx.length||1));$('#merkleOut').textContent=levels.map((l,i)=>`Nivel ${i}:\n${l.map(h=>'  '+h).join('\n')}`).join('\n\n');setStatus($('#merkleStatus'),`Raíz Merkle: ${root}`,'good')}
$('#buildMerkle').onclick=buildMerkle;$('#changeTx').onclick=()=>{$('#transactions').value=$('#transactions').value.replace('3','3.01');setStatus($('#merkleStatus'),'Se modificó una transacción. Reconstruí el árbol y compará la raíz.','warn')};init();buildMerkle();
</script></body></html>
