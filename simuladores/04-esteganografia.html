<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Esteganografía digital</title><link rel="stylesheet" href="assets/lab.css"></head><body><main class="shell" id="app"></main><script src="assets/lab.js"></script><script>
const {nav,footer,$,te,td,setStatus}=Lab;$('#app').innerHTML=nav()+`<section class="hero"><div class="eyebrow">Módulo 4</div><h1>Esteganografía digital</h1><p>Ocultá un mensaje dentro de una imagen mediante sustitución del bit menos significativo. Medí capacidad, distorsión y fragilidad para distinguir esteganografía de criptografía.</p></section><section class="grid"><article class="card full"><h2>Imagen portadora</h2><div class="controls"><div class="control"><label>Cargar imagen</label><input id="file" type="file" accept="image/*"></div><div class="control"><label>Alternativa</label><button class="secondary" id="generate">Generar imagen de prueba</button></div></div><div class="two-col" style="margin-top:14px"><div><label>Original</label><canvas id="original" width="520" height="300"></canvas></div><div><label>Con mensaje oculto</label><canvas id="stego" width="520" height="300"></canvas></div></div><div class="metric-grid" style="margin-top:14px"><div class="metric"><strong id="capacity">0</strong><span>bytes disponibles</span></div><div class="metric"><strong id="used">0</strong><span>bytes utilizados</span></div><div class="metric"><strong id="mse">0</strong><span>error cuadrático medio</span></div><div class="metric"><strong id="psnr">∞</strong><span>PSNR aproximado</span></div></div></article><article class="card"><h2>Ocultar mensaje</h2><div class="control"><label>Mensaje secreto</label><textarea id="secret">La existencia de este mensaje está oculta, pero su contenido no está cifrado.</textarea></div><div class="actions"><button id="embed">Insertar en LSB</button><button class="secondary" id="download">Descargar PNG</button></div><div class="status" id="embedStatus">Se utilizan los canales RGB; el canal alfa no se modifica.</div></article><article class="card"><h2>Extraer mensaje</h2><div class="actions"><button id="extract">Leer desde imagen estego</button><button class="danger" id="damage">Simular alteración</button></div><div class="output" id="recovered"></div><div class="status" id="extractStatus">La extracción requiere conocer el método y leer los bits en el mismo orden.</div></article><article class="card full"><h2>Estegoanálisis básico</h2><p class="muted">La sustitución LSB cambia la paridad de los valores de color. Un atacante puede buscar irregularidades estadísticas, comparar histogramas o detectar patrones incompatibles con el proceso natural de captura.</p><div class="metric-grid"><div class="metric"><strong id="evenOriginal">—</strong><span>pares en original</span></div><div class="metric"><strong id="evenStego">—</strong><span>pares en estego</span></div><div class="metric"><strong id="changedChannels">0</strong><span>canales modificados</span></div><div class="metric"><strong id="changePct">0%</strong><span>porcentaje modificado</span></div></div><div class="status" id="analysisStatus">Una alta calidad visual no implica indetectabilidad estadística.</div></article><article class="card"><h2>Qué demuestra</h2><div class="table-wrap"><table><thead><tr><th>Propiedad</th><th>Resultado</th></tr></thead><tbody><tr><td>Confidencialidad</td><td>No está garantizada: el texto se guarda en claro.</td></tr><tr><td>Ocultamiento</td><td>La existencia del mensaje no es evidente visualmente.</td></tr><tr><td>Robustez</td><td>Baja frente a recorte, compresión o transformación.</td></tr><tr><td>Capacidad</td><td>Depende del tamaño y número de canales.</td></tr></tbody></table></div></article><article class="card"><h2>Desafío</h2><ol class="steps"><li>Probá mensajes de distinta longitud y observá la distorsión.</li><li>Descargá el PNG, volvé a cargarlo y extraé el texto.</li><li>Convertí o comprimí la imagen fuera del laboratorio y repetí.</li><li>Proponé una arquitectura que cifre antes de ocultar.</li></ol></article></section>`+footer();
const oc=$('#original'),sc=$('#stego'),octx=oc.getContext('2d',{willReadFrequently:true}),sctx=sc.getContext('2d',{willReadFrequently:true});let originalData=null,stegoData=null;
function generate(){const w=oc.width,h=oc.height,img=octx.createImageData(w,h);for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;const noise=(Math.sin(x*.13)+Math.cos(y*.17))*9;img.data[i]=Math.max(0,Math.min(255,30+x/w*190+noise));img.data[i+1]=Math.max(0,Math.min(255,50+y/h*160-noise));img.data[i+2]=Math.max(0,Math.min(255,180+40*Math.sin((x+y)/38)));img.data[i+3]=255}octx.putImageData(img,0,0);sctx.putImageData(img,0,0);originalData=octx.getImageData(0,0,w,h);stegoData=sctx.getImageData(0,0,w,h);refreshMetrics()}
function capacity(){return Math.floor((oc.width*oc.height*3-32)/8)}
function bytesToBits(bytes){const bits=[];for(const b of bytes)for(let i=7;i>=0;i--)bits.push((b>>i)&1);return bits}
function intBits(n){const bits=[];for(let i=31;i>=0;i--)bits.push((n>>>i)&1);return bits}
function readBits(data,count){const bits=[];for(let i=0;i<data.length&&bits.length<count;i++)if(i%4!==3)bits.push(data[i]&1);return bits}
function bitsToInt(bits){let n=0;for(const b of bits)n=(n*2+b)>>>0;return n}
function bitsToBytes(bits){const out=new Uint8Array(Math.floor(bits.length/8));for(let i=0;i<out.length;i++){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i*8+j];out[i]=b}return out}
function refreshMetrics(){if(!originalData||!stegoData)return;$('#capacity').textContent=capacity();let sq=0,changed=0,evenO=0,evenS=0,total=0;for(let i=0;i<originalData.data.length;i++){if(i%4===3)continue;const a=originalData.data[i],b=stegoData.data[i];sq+=(a-b)**2;if(a!==b)changed++;if(a%2===0)evenO++;if(b%2===0)evenS++;total++}const mse=sq/Math.max(1,total),psnr=mse===0?Infinity:10*Math.log10(255**2/mse);$('#mse').textContent=mse.toFixed(5);$('#psnr').textContent=Number.isFinite(psnr)?psnr.toFixed(2)+' dB':'∞';$('#changedChannels').textContent=changed;$('#changePct').textContent=(changed/total*100).toFixed(3)+'%';$('#evenOriginal').textContent=(evenO/total*100).toFixed(2)+'%';$('#evenStego').textContent=(evenS/total*100).toFixed(2)+'%'}
$('#embed').onclick=()=>{if(!originalData)return;const msg=te.encode($('#secret').value);if(msg.length>capacity()){setStatus($('#embedStatus'),`Mensaje demasiado largo. Máximo: ${capacity()} bytes.`,'bad');return}const img=new ImageData(new Uint8ClampedArray(originalData.data),originalData.width,originalData.height),bits=[...intBits(msg.length),...bytesToBits(msg)];let k=0;for(let i=0;i<img.data.length&&k<bits.length;i++)if(i%4!==3)img.data[i]=(img.data[i]&254)|bits[k++];sctx.putImageData(img,0,0);stegoData=sctx.getImageData(0,0,sc.width,sc.height);$('#used').textContent=msg.length;refreshMetrics();setStatus($('#embedStatus'),`${msg.length} bytes ocultos en ${bits.length} bits. Se modificaron como máximo ${bits.length} canales.`,'good')};
$('#extract').onclick=()=>{if(!stegoData)return;try{const head=readBits(stegoData.data,32),len=bitsToInt(head);if(len>capacity())throw new Error('Cabecera inválida o imagen alterada');const all=readBits(stegoData.data,32+len*8),msg=bitsToBytes(all.slice(32));$('#recovered').textContent=td.decode(msg);setStatus($('#extractStatus'),`Se recuperaron ${len} bytes.`,'good')}catch(e){$('#recovered').textContent='';setStatus($('#extractStatus'),e.message,'bad')}};
$('#damage').onclick=()=>{if(!stegoData)return;const img=new ImageData(new Uint8ClampedArray(stegoData.data),stegoData.width,stegoData.height);for(let i=0;i<Math.min(600,img.data.length);i+=17)if(i%4!==3)img.data[i]^=1;sctx.putImageData(img,0,0);stegoData=sctx.getImageData(0,0,sc.width,sc.height);refreshMetrics();setStatus($('#extractStatus'),'Se alteraron bits cercanos al comienzo. La cabecera o el mensaje pueden quedar corruptos.','warn')};
$('#download').onclick=()=>{const a=document.createElement('a');a.download='imagen_con_mensaje.png';a.href=sc.toDataURL('image/png');a.click()};$('#generate').onclick=generate;
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const img=new Image;img.onload=()=>{const scale=Math.min(520/img.width,300/img.height,1),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));oc.width=sc.width=w;oc.height=sc.height=h;octx.drawImage(img,0,0,w,h);sctx.drawImage(img,0,0,w,h);originalData=octx.getImageData(0,0,w,h);stegoData=sctx.getImageData(0,0,w,h);$('#used').textContent=0;refreshMetrics();URL.revokeObjectURL(img.src)};img.src=URL.createObjectURL(f)};generate();
</script></body></html>
