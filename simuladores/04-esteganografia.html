<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Laboratorio de esteganografía LSB con cabecera, versión, checksum SHA-256, capacidad, PSNR, plano de bits y simulación de daño.">
  <title>Esteganografía digital | Laboratorio interactivo</title>
  <link rel="stylesheet" href="assets/lab.css">
</head>
<body>
  <main class="shell" id="app"></main>
  <noscript><div class="runtime-error">Este laboratorio necesita JavaScript para ejecutar las simulaciones.</div></noscript>

  <script src="assets/lab.js"></script>
  <script>
    const { nav, footer, $, te, td, sha256, setStatus } = Lab;

    $('#app').innerHTML = nav() + `
      <section class="hero">
        <div class="eyebrow">Módulo 4</div>
        <h1>Esteganografía digital</h1>
        <p>Ocultá un mensaje en los bits menos significativos de una imagen, verificá su integridad y medí el costo visual y estadístico. La simulación separa ocultamiento, confidencialidad y robustez.</p>
      </section>

      <section class="grid">
        <article class="card full">
          <h2>Imagen portadora</h2>
          <div class="controls">
            <div class="control"><label>Cargar imagen</label><input id="imageFile" type="file" accept="image/png,image/jpeg,image/webp"></div>
            <div class="control"><label>Alternativa</label><button class="secondary" id="generateCarrier">Generar imagen de prueba</button></div>
            <div class="control">
              <label>Profundidad de inserción</label>
              <select id="lsbDepth">
                <option value="1" selected>1 bit por canal RGB</option>
                <option value="2">2 bits por canal RGB</option>
              </select>
            </div>
          </div>

          <div class="two-col" style="margin-top:14px">
            <div><label>Original</label><canvas id="originalCanvas" width="520" height="300"></canvas></div>
            <div><label>Imagen estego</label><canvas id="stegoCanvas" width="520" height="300"></canvas></div>
          </div>

          <div class="metric-grid" style="margin-top:14px">
            <div class="metric"><strong id="capacityBytes">0</strong><span>bytes de carga útil</span></div>
            <div class="metric"><strong id="usedBytes">0</strong><span>bytes utilizados</span></div>
            <div class="metric"><strong id="mseValue">0</strong><span>error cuadrático medio</span></div>
            <div class="metric"><strong id="psnrValue">∞</strong><span>PSNR</span></div>
          </div>
          <div class="status" id="carrierStatus">La capacidad utiliza canales RGB; el canal alfa no se modifica.</div>
        </article>

        <article class="card">
          <h2>Ocultar mensaje</h2>
          <div class="control"><label>Mensaje UTF-8</label><textarea id="secretMessage">La existencia de este mensaje está oculta, pero su contenido no está cifrado.</textarea></div>
          <div class="actions">
            <button id="embedMessage">Insertar mensaje</button>
            <button class="secondary" id="downloadPng">Descargar PNG</button>
          </div>
          <div class="output mono" id="headerOutput"></div>
          <div class="status" id="embedStatus">El contenedor incluye magic, versión, profundidad, longitud y checksum.</div>
        </article>

        <article class="card">
          <h2>Extraer y verificar</h2>
          <div class="actions">
            <button id="extractMessage">Extraer mensaje</button>
            <button class="danger" id="flipBits">Alterar bits aleatorios</button>
            <button class="danger" id="quantizeImage">Simular procesamiento</button>
          </div>
          <div class="output" id="recoveredMessage"></div>
          <div class="metric-grid" style="margin-top:14px">
            <div class="metric"><strong id="headerState">—</strong><span>cabecera</span></div>
            <div class="metric"><strong id="checksumState">—</strong><span>checksum</span></div>
            <div class="metric"><strong id="recoveredBytes">0</strong><span>bytes recuperados</span></div>
            <div class="metric"><strong id="embeddedDepth">—</strong><span>profundidad declarada</span></div>
          </div>
          <div class="status" id="extractStatus">El checksum permite detectar corrupción accidental, pero no autentica frente a un adversario.</div>
        </article>

        <article class="card full">
          <h2>Plano de bits y estegoanálisis básico</h2>
          <p class="muted">La vista amplifica el bit menos significativo del canal azul. Una imagen visualmente idéntica puede revelar estructura artificial cuando se inspeccionan planos de bits y paridades.</p>
          <div class="two-col">
            <div><label>Plano LSB original</label><canvas id="originalBitPlane" width="520" height="300"></canvas></div>
            <div><label>Plano LSB estego</label><canvas id="stegoBitPlane" width="520" height="300"></canvas></div>
          </div>
          <div class="metric-grid" style="margin-top:14px">
            <div class="metric"><strong id="evenOriginal">—</strong><span>canales pares original</span></div>
            <div class="metric"><strong id="evenStego">—</strong><span>canales pares estego</span></div>
            <div class="metric"><strong id="changedChannels">0</strong><span>canales modificados</span></div>
            <div class="metric"><strong id="changedPercent">0%</strong><span>porcentaje modificado</span></div>
          </div>
          <div class="status" id="analysisStatus">Una alta calidad visual no implica indetectabilidad estadística.</div>
        </article>

        <article class="card">
          <h2>Qué demuestra</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Propiedad</th><th>Resultado del modelo</th></tr></thead>
              <tbody>
                <tr><td>Confidencialidad</td><td>No está garantizada: el mensaje se almacena en claro.</td></tr>
                <tr><td>Ocultamiento</td><td>La existencia no es evidente en la imagen renderizada.</td></tr>
                <tr><td>Integridad</td><td>El checksum detecta cambios accidentales, no ataques activos.</td></tr>
                <tr><td>Robustez</td><td>Baja frente a compresión con pérdida, cuantización, recorte o redimensionado.</td></tr>
                <tr><td>Capacidad</td><td>Aumenta con píxeles, canales y profundidad; también aumenta la distorsión.</td></tr>
              </tbody>
            </table>
          </div>
        </article>

        <article class="card">
          <h2>Desafío</h2>
          <ol class="steps">
            <li>Compará 1 y 2 bits por canal usando el mismo mensaje.</li>
            <li>Observá PSNR, canales modificados y planos de bits.</li>
            <li>Aplicá alteraciones hasta que falle el checksum.</li>
            <li>Diseñá una arquitectura “cifrar y luego ocultar” con autenticación.</li>
            <li>Explicá por qué checksum, MAC y firma digital resuelven problemas diferentes.</li>
          </ol>
        </article>
      </section>` + footer();

    const MAGIC = te.encode('STEG');
    const VERSION = 1;
    const HEADER_BYTES = 14;
    const HEADER_BITS = HEADER_BYTES * 8;

    const originalCanvas = $('#originalCanvas');
    const stegoCanvas = $('#stegoCanvas');
    const originalContext = originalCanvas.getContext('2d', { willReadFrequently: true });
    const stegoContext = stegoCanvas.getContext('2d', { willReadFrequently: true });
    const originalPlaneContext = $('#originalBitPlane').getContext('2d');
    const stegoPlaneContext = $('#stegoBitPlane').getContext('2d');

    let originalData = null;
    let stegoData = null;

    function rgbChannelIndexes(dataLength) {
      const indexes = [];
      for (let index = 0; index < dataLength; index += 1) {
        if (index % 4 !== 3) indexes.push(index);
      }
      return indexes;
    }

    function bytesToBits(bytes) {
      const bits = [];
      for (const byte of bytes) {
        for (let bit = 7; bit >= 0; bit -= 1) bits.push((byte >> bit) & 1);
      }
      return bits;
    }

    function bitsToBytes(bits) {
      const output = new Uint8Array(Math.floor(bits.length / 8));
      for (let index = 0; index < output.length; index += 1) {
        let byte = 0;
        for (let bit = 0; bit < 8; bit += 1) byte = (byte << 1) | bits[index * 8 + bit];
        output[index] = byte;
      }
      return output;
    }

    function writeUint32(target, offset, value) {
      new DataView(target.buffer, target.byteOffset, target.byteLength).setUint32(offset, value, false);
    }

    function readUint32(source, offset) {
      return new DataView(source.buffer, source.byteOffset, source.byteLength).getUint32(offset, false);
    }

    async function checksum32(bytes) {
      const digestHex = await sha256(td.decode(bytes));
      return Number.parseInt(digestHex.slice(0, 8), 16) >>> 0;
    }

    function buildHeader(depth, length, checksum) {
      const header = new Uint8Array(HEADER_BYTES);
      header.set(MAGIC, 0);
      header[4] = VERSION;
      header[5] = depth;
      writeUint32(header, 6, length);
      writeUint32(header, 10, checksum);
      return header;
    }

    function parseHeader(header) {
      if (header.length !== HEADER_BYTES) throw new Error('Cabecera incompleta.');
      for (let index = 0; index < MAGIC.length; index += 1) {
        if (header[index] !== MAGIC[index]) throw new Error('Magic STEG ausente: la imagen no contiene este formato.');
      }
      if (header[4] !== VERSION) throw new Error(`Versión ${header[4]} no soportada.`);
      const depth = header[5];
      if (![1, 2].includes(depth)) throw new Error('Profundidad LSB inválida.');
      return {
        version: header[4],
        depth,
        length: readUint32(header, 6),
        checksum: readUint32(header, 10)
      };
    }

    function capacity(depth = Number($('#lsbDepth').value)) {
      if (!originalData) return 0;
      const channels = rgbChannelIndexes(originalData.data.length).length;
      return Math.max(0, Math.floor((channels - HEADER_BITS) * depth / 8));
    }

    function readFixedHeaderBits(data) {
      const indexes = rgbChannelIndexes(data.length);
      return indexes.slice(0, HEADER_BITS).map((index) => data[index] & 1);
    }

    function writeFixedHeaderBits(data, bits) {
      const indexes = rgbChannelIndexes(data.length);
      for (let index = 0; index < bits.length; index += 1) {
        data[indexes[index]] = (data[indexes[index]] & 0xfe) | bits[index];
      }
    }

    function writePayloadBits(data, bits, depth) {
      const indexes = rgbChannelIndexes(data.length).slice(HEADER_BITS);
      let cursor = 0;
      const mask = depth === 1 ? 0xfe : 0xfc;

      for (const dataIndex of indexes) {
        if (cursor >= bits.length) break;
        let value = 0;
        for (let offset = 0; offset < depth; offset += 1) {
          value = (value << 1) | (bits[cursor] ?? 0);
          cursor += 1;
        }
        data[dataIndex] = (data[dataIndex] & mask) | value;
      }
      if (cursor < bits.length) throw new Error('Capacidad insuficiente durante la escritura.');
    }

    function readPayloadBits(data, bitCount, depth) {
      const indexes = rgbChannelIndexes(data.length).slice(HEADER_BITS);
      const bits = [];
      const mask = (1 << depth) - 1;

      for (const dataIndex of indexes) {
        const value = data[dataIndex] & mask;
        for (let offset = depth - 1; offset >= 0; offset -= 1) bits.push((value >> offset) & 1);
        if (bits.length >= bitCount) return bits.slice(0, bitCount);
      }
      throw new Error('La imagen terminó antes de recuperar la carga declarada.');
    }

    function generateCarrier() {
      const width = originalCanvas.width;
      const height = originalCanvas.height;
      const image = originalContext.createImageData(width, height);

      for (let y = 0; y < height; y += 1) {
        for (let x = 0; x < width; x += 1) {
          const index = (y * width + x) * 4;
          const wave = Math.sin(x * 0.13) * 8 + Math.cos(y * 0.17) * 8;
          const texture = ((x * 17 + y * 31) % 13) - 6;
          image.data[index] = Math.max(0, Math.min(255, 25 + x / width * 195 + wave + texture));
          image.data[index + 1] = Math.max(0, Math.min(255, 45 + y / height * 165 - wave + texture));
          image.data[index + 2] = Math.max(0, Math.min(255, 155 + 55 * Math.sin((x + y) / 38) - texture));
          image.data[index + 3] = 255;
        }
      }

      originalContext.putImageData(image, 0, 0);
      stegoContext.putImageData(image, 0, 0);
      originalData = originalContext.getImageData(0, 0, width, height);
      stegoData = stegoContext.getImageData(0, 0, width, height);
      $('#usedBytes').textContent = 0;
      $('#recoveredMessage').textContent = '';
      $('#headerOutput').textContent = '';
      updateMetrics();
      setStatus($('#carrierStatus'), 'Imagen sintética generada. Ya puede utilizarse como portadora.', 'good');
    }

    function renderBitPlane(source, context, width, height) {
      const plane = context.createImageData(width, height);
      for (let pixel = 0; pixel < width * height; pixel += 1) {
        const sourceIndex = pixel * 4 + 2;
        const targetIndex = pixel * 4;
        const value = source.data[sourceIndex] & 1 ? 255 : 0;
        plane.data[targetIndex] = value;
        plane.data[targetIndex + 1] = value;
        plane.data[targetIndex + 2] = value;
        plane.data[targetIndex + 3] = 255;
      }
      context.putImageData(plane, 0, 0);
    }

    function updateMetrics() {
      if (!originalData || !stegoData) return;
      $('#capacityBytes').textContent = capacity();

      let squaredError = 0;
      let changed = 0;
      let evenOriginalCount = 0;
      let evenStegoCount = 0;
      let total = 0;

      for (let index = 0; index < originalData.data.length; index += 1) {
        if (index % 4 === 3) continue;
        const original = originalData.data[index];
        const stego = stegoData.data[index];
        squaredError += (original - stego) ** 2;
        if (original !== stego) changed += 1;
        if (original % 2 === 0) evenOriginalCount += 1;
        if (stego % 2 === 0) evenStegoCount += 1;
        total += 1;
      }

      const mse = squaredError / Math.max(1, total);
      const psnr = mse === 0 ? Number.POSITIVE_INFINITY : 10 * Math.log10((255 ** 2) / mse);
      $('#mseValue').textContent = mse.toFixed(6);
      $('#psnrValue').textContent = Number.isFinite(psnr) ? `${psnr.toFixed(2)} dB` : '∞';
      $('#changedChannels').textContent = changed;
      $('#changedPercent').textContent = `${(100 * changed / Math.max(1, total)).toFixed(3)}%`;
      $('#evenOriginal').textContent = `${(100 * evenOriginalCount / Math.max(1, total)).toFixed(2)}%`;
      $('#evenStego').textContent = `${(100 * evenStegoCount / Math.max(1, total)).toFixed(2)}%`;

      renderBitPlane(originalData, originalPlaneContext, originalCanvas.width, originalCanvas.height);
      renderBitPlane(stegoData, stegoPlaneContext, stegoCanvas.width, stegoCanvas.height);
    }

    $('#lsbDepth').onchange = () => {
      $('#capacityBytes').textContent = capacity();
      setStatus($('#carrierStatus'), `Profundidad seleccionada: ${$('#lsbDepth').value} bit(s) por canal. Una mayor capacidad aumenta la perturbación.`, 'warn');
    };

    $('#embedMessage').onclick = async () => {
      try {
        if (!originalData) throw new Error('Cargá o generá primero una imagen portadora.');
        const message = te.encode($('#secretMessage').value);
        const depth = Number($('#lsbDepth').value);
        const maximum = capacity(depth);
        if (message.length > maximum) throw new Error(`Mensaje demasiado largo: ${message.length} bytes. Capacidad: ${maximum} bytes.`);

        const checksum = await checksum32(message);
        const header = buildHeader(depth, message.length, checksum);
        const image = new ImageData(
          new Uint8ClampedArray(originalData.data),
          originalData.width,
          originalData.height
        );

        writeFixedHeaderBits(image.data, bytesToBits(header));
        writePayloadBits(image.data, bytesToBits(message), depth);
        stegoContext.putImageData(image, 0, 0);
        stegoData = stegoContext.getImageData(0, 0, stegoCanvas.width, stegoCanvas.height);

        $('#usedBytes').textContent = message.length;
        $('#headerOutput').textContent = [
          'magic=STEG',
          `version=${VERSION}`,
          `depth=${depth}`,
          `length=${message.length}`,
          `checksum32=0x${checksum.toString(16).padStart(8, '0')}`
        ].join('\n');
        updateMetrics();
        setStatus($('#embedStatus'), `${message.length} bytes insertados con profundidad ${depth}. La cabecera ocupa ${HEADER_BYTES} bytes lógicos.`, 'good');
      } catch (error) {
        setStatus($('#embedStatus'), error.message, 'bad');
      }
    };

    $('#extractMessage').onclick = async () => {
      try {
        if (!stegoData) throw new Error('No hay imagen estego disponible.');
        const header = bitsToBytes(readFixedHeaderBits(stegoData.data));
        const parsed = parseHeader(header);
        $('#headerState').textContent = 'Válida';
        $('#embeddedDepth').textContent = parsed.depth;

        const maximum = capacity(parsed.depth);
        if (parsed.length > maximum) throw new Error(`Longitud declarada ${parsed.length} supera la capacidad ${maximum}.`);
        const payloadBits = readPayloadBits(stegoData.data, parsed.length * 8, parsed.depth);
        const message = bitsToBytes(payloadBits);
        const actualChecksum = await checksum32(message);
        const checksumValid = actualChecksum === parsed.checksum;

        $('#checksumState').textContent = checksumValid ? 'Válido' : 'Inválido';
        $('#recoveredBytes').textContent = message.length;
        $('#recoveredMessage').textContent = td.decode(message);
        setStatus(
          $('#extractStatus'),
          checksumValid
            ? 'Extracción correcta: cabecera, longitud y checksum son coherentes.'
            : `El mensaje se recuperó, pero el checksum no coincide: esperado 0x${parsed.checksum.toString(16).padStart(8, '0')}, obtenido 0x${actualChecksum.toString(16).padStart(8, '0')}.`,
          checksumValid ? 'good' : 'bad'
        );
      } catch (error) {
        $('#headerState').textContent = 'Inválida';
        $('#checksumState').textContent = '—';
        $('#recoveredBytes').textContent = '0';
        $('#recoveredMessage').textContent = '';
        setStatus($('#extractStatus'), error.message, 'bad');
      }
    };

    $('#flipBits').onclick = () => {
      if (!stegoData) return;
      const image = new ImageData(
        new Uint8ClampedArray(stegoData.data),
        stegoData.width,
        stegoData.height
      );
      const indexes = rgbChannelIndexes(image.data.length);
      const changes = Math.min(80, indexes.length);
      for (let count = 0; count < changes; count += 1) {
        const position = indexes[Math.floor(Math.random() * Math.min(indexes.length, HEADER_BITS + 1200))];
        image.data[position] ^= 1;
      }
      stegoContext.putImageData(image, 0, 0);
      stegoData = stegoContext.getImageData(0, 0, stegoCanvas.width, stegoCanvas.height);
      updateMetrics();
      setStatus($('#extractStatus'), `${changes} bits LSB fueron alterados. La cabecera o el checksum deberían detectar el daño.`, 'warn');
    };

    $('#quantizeImage').onclick = () => {
      if (!stegoData) return;
      const image = new ImageData(
        new Uint8ClampedArray(stegoData.data),
        stegoData.width,
        stegoData.height
      );
      for (let index = 0; index < image.data.length; index += 1) {
        if (index % 4 === 3) continue;
        image.data[index] = Math.round(image.data[index] / 8) * 8;
      }
      stegoContext.putImageData(image, 0, 0);
      stegoData = stegoContext.getImageData(0, 0, stegoCanvas.width, stegoCanvas.height);
      updateMetrics();
      setStatus($('#extractStatus'), 'Se aplicó cuantización de color. Este procesamiento destruye gran parte de los LSB.', 'warn');
    };

    $('#downloadPng').onclick = () => {
      const anchor = document.createElement('a');
      anchor.download = 'imagen_esteganografica.png';
      anchor.href = stegoCanvas.toDataURL('image/png');
      anchor.click();
    };

    $('#generateCarrier').onclick = generateCarrier;

    $('#imageFile').onchange = (event) => {
      const file = event.target.files?.[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        setStatus($('#carrierStatus'), 'El archivo seleccionado no es una imagen compatible.', 'bad');
        return;
      }
      if (file.size > 15 * 1024 * 1024) {
        setStatus($('#carrierStatus'), 'La imagen supera el límite didáctico de 15 MB.', 'bad');
        return;
      }

      const image = new Image();
      image.onload = () => {
        const scale = Math.min(760 / image.width, 480 / image.height, 1);
        const width = Math.max(1, Math.round(image.width * scale));
        const height = Math.max(1, Math.round(image.height * scale));
        for (const canvas of [originalCanvas, stegoCanvas, $('#originalBitPlane'), $('#stegoBitPlane')]) {
          canvas.width = width;
          canvas.height = height;
        }
        originalContext.drawImage(image, 0, 0, width, height);
        stegoContext.drawImage(image, 0, 0, width, height);
        originalData = originalContext.getImageData(0, 0, width, height);
        stegoData = stegoContext.getImageData(0, 0, width, height);
        $('#usedBytes').textContent = 0;
        $('#headerOutput').textContent = '';
        updateMetrics();
        URL.revokeObjectURL(image.src);
        setStatus($('#carrierStatus'), `Imagen cargada y normalizada a ${width}×${height} píxeles.`, 'good');
      };
      image.onerror = () => setStatus($('#carrierStatus'), 'No se pudo decodificar la imagen.', 'bad');
      image.src = URL.createObjectURL(file);
    };

    generateCarrier();
  </script>
</body>
</html>
