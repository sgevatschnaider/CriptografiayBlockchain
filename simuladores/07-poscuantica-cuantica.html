<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criptografía poscuántica y cuántica</title><link rel="stylesheet" href="assets/lab.css"></head><body><main class="shell" id="app"></main><script src="assets/lab.js"></script><script>
const {nav,footer,$,randomInt,setStatus}=Lab;$('#app').innerHTML=nav()+`<section class="hero"><div class="eyebrow">Módulo 7</div><h1>Criptografía poscuántica y cuántica</h1><p>Separá tres ideas que suelen confundirse: ataques cuánticos contra criptografía actual, algoritmos poscuánticos ejecutados en computadoras clásicas y protocolos cuánticos como BB84.</p></section><section class="grid"><article class="card"><h2>Complejidad de búsqueda</h2><div class="control"><label>Bits de una clave simétrica: <span id="bitsLabel">128</span></label><input id="bits" type="range" min="32" max="256" step="8" value="128"></div><div class="metric-grid" style="margin-top:14px"><div class="metric"><strong id="classExp">2¹²⁸</strong><span>búsqueda clásica</span></div><div class="metric"><strong id="groverExp">2⁶⁴</strong><span>Grover idealizado</span></div><div class="metric"><strong id="classBits">128</strong><span>bits clásicos</span></div><div class="metric"><strong id="quantumBits">64</strong><span>seguridad idealizada</span></div></div><div class="status" id="complexStatus">Grover ofrece una mejora cuadrática idealizada, no una ruptura instantánea.</div></article><article class="card"><h2>Impacto conceptual</h2><div class="table-wrap"><table><thead><tr><th>Familia</th><th>Computación cuántica relevante</th></tr></thead><tbody><tr><td>RSA / DH / ECC</td><td>Shor amenaza los problemas de factorización y logaritmo discreto.</td></tr><tr><td>AES / hashes</td><td>Grover reduce idealmente el exponente de búsqueda.</td></tr><tr><td>ML‑KEM / ML‑DSA</td><td>Diseñados frente a ataques clásicos y cuánticos conocidos.</td></tr><tr><td>QKD</td><td>Usa estados cuánticos para distribuir material de clave.</td></tr></tbody></table></div></article><article class="card full"><h2>Simulador BB84</h2><p class="muted">Alice prepara bits en bases recta (+) o diagonal (×). Bob mide con bases aleatorias. Al comparar bases conservan únicamente las posiciones compatibles. Eve, si está activa, introduce perturbaciones medibles.</p><div class="controls"><div class="control"><label>Número de fotones</label><select id="photons"><option>16</option><option selected>32</option><option>64</option><option>128</option></select></div><div class="control"><label>Atacante</label><select id="eve"><option value="0">Sin Eve</option><option value="1">Eve intercepta y reenvía</option></select></div></div><div class="actions"><button id="runBB84">Ejecutar BB84</button></div><div class="metric-grid" style="margin-top:14px"><div class="metric"><strong id="sifted">0</strong><span>bits conservados</span></div><div class="metric"><strong id="qber">0%</strong><span>QBER observado</span></div><div class="metric"><strong id="eveState">No</strong><span>intercepción</span></div><div class="metric"><strong id="decision">—</strong><span>decisión</span></div></div><div class="table-wrap" style="margin-top:14px"><table><thead><tr><th>i</th><th>A bit</th><th>A base</th><th>E base</th><th>B base</th><th>B bit</th><th>Conservar</th></tr></thead><tbody id="bb84Rows"></tbody></table></div><div class="status" id="bb84Status">Una muestra finita produce variación; repetí el experimento.</div></article><article class="card full"><h2>Estándares poscuánticos de referencia</h2><div class="module-cards"><a class="module-card" href="https://csrc.nist.gov/pubs/fips/203/final" target="_blank" rel="noreferrer"><span class="tag">FIPS 203</span><b>ML‑KEM</b><p>Mecanismo de encapsulación de claves basado en retículas. Establece un secreto compartido para cifrado simétrico.</p></a><a class="module-card" href="https://csrc.nist.gov/pubs/fips/204/final" target="_blank" rel="noreferrer"><span class="tag">FIPS 204</span><b>ML‑DSA</b><p>Firma digital basada en retículas para autenticidad e integridad.</p></a><a class="module-card" href="https://csrc.nist.gov/pubs/fips/205/final" target="_blank" rel="noreferrer"><span class="tag">FIPS 205</span><b>SLH‑DSA</b><p>Firma sin estado basada en hashes, con una base matemática diferente.</p></a><div class="module-card"><span class="tag">Estrategia</span><b>Despliegue híbrido</b><p>Combina mecanismos clásicos y poscuánticos durante la transición, con formatos versionados y agilidad criptográfica.</p></div></div><div class="callout" style="margin-top:16px">Este laboratorio no implementa ML‑KEM, ML‑DSA ni SLH‑DSA. Una visualización educativa no debe confundirse con una biblioteca criptográfica validada.</div></article><article class="card full"><h2>Inventario y prioridad de migración</h2><p class="muted">La migración comienza identificando dónde viven los algoritmos, cuánto tiempo deben permanecer secretos los datos y qué tan difícil es reemplazar el componente.</p><div class="table-wrap"><table><thead><tr><th>Sistema</th><th>Algoritmo actual</th><th>Vida del dato</th><th>Exposición</th><th>Dificultad</th><th>Prioridad</th></tr></thead><tbody id="inventory"></tbody></table></div><div class="actions"><button id="recalc">Recalcular prioridades</button></div><div class="status" id="inventoryStatus">“Recolectar ahora, descifrar después” vuelve urgente proteger datos de larga vida.</div></article><article class="card"><h2>Ruta de transición</h2><ol class="steps"><li>Inventariar algoritmos, certificados, bibliotecas y dependencias.</li><li>Clasificar información por vida útil y exposición.</li><li>Introducir agilidad criptográfica y formatos versionados.</li><li>Probar interoperabilidad, rendimiento y rollback.</li><li>Migrar por riesgo y mantener monitoreo de estándares y erratas.</li></ol></article><article class="card"><h2>Desafío</h2><ol class="steps"><li>Compará 128 y 256 bits frente a Grover.</li><li>Ejecutá BB84 veinte veces con y sin Eve.</li><li>Explicá por qué QKD no reemplaza firmas ni autenticación.</li><li>Priorizá un sistema que deba guardar secretos por veinte años.</li></ol></article></section>`+footer();
function superscript(n){const m={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};return String(n).split('').map(c=>m[c]||c).join('')}function updateBits(){const n=+$('#bits').value,q=Math.ceil(n/2);$('#bitsLabel').textContent=n;$('#classExp').textContent='2'+superscript(n);$('#groverExp').textContent='2'+superscript(q);$('#classBits').textContent=n;$('#quantumBits').textContent=q;setStatus($('#complexStatus'),n>=256?'Una clave de 256 bits conserva aproximadamente 128 bits frente a Grover idealizado.':'La estimación ignora costos físicos, paralelización y estructura del sistema.','good')}$('#bits').oninput=updateBits;
function rndBit(){return randomInt(0,1)}function runBB84(){const n=+$('#photons').value,eve=$('#eve').value==='1',rows=[];let kept=0,errors=0;for(let i=0;i<n;i++){const abit=rndBit(),abase=rndBit();let transmitted=abit,ebase='—';if(eve){const eb=rndBit();ebase=eb?'×':'+';transmitted=eb===abase?abit:rndBit()}const bbase=rndBit(),bbit=bbase===(eve?null:abase)?abit:(eve?(bbase===(ebase==='×'?1:0)?transmitted:rndBit()):(bbase===abase?abit:rndBit()));const keep=abase===bbase;if(keep){kept++;if(bbit!==abit)errors++}rows.push({i:i+1,abit,abase:abase?'×':'+',ebase,bbase:bbase?'×':'+',bbit,keep})}const qber=kept?errors/kept:0;$('#sifted').textContent=kept;$('#qber').textContent=(qber*100).toFixed(1)+'%';$('#eveState').textContent=eve?'Sí':'No';const decision=qber>.11?'Abortar':'Continuar';$('#decision').textContent=decision;$('#bb84Rows').innerHTML=rows.slice(0,32).map(r=>`<tr><td>${r.i}</td><td>${r.abit}</td><td>${r.abase}</td><td>${r.ebase}</td><td>${r.bbase}</td><td>${r.bbit}</td><td>${r.keep?'✓':'—'}</td></tr>`).join('');setStatus($('#bb84Status'),`Se conservaron ${kept}/${n} posiciones y se observaron ${errors} errores. ${decision==='Abortar'?'El QBER es alto en esta muestra.':'El QBER no supera el umbral didáctico.'}`,decision==='Abortar'?'bad':'good')}
$('#runBB84').onclick=runBB84;
const systems=[{name:'Portal web',alg:'ECDHE + RSA',life:2,exposure:3,difficulty:1},{name:'Archivo legal',alg:'RSA-OAEP',life:20,exposure:2,difficulty:2},{name:'Firmware IoT',alg:'ECDSA',life:12,exposure:3,difficulty:3},{name:'VPN corporativa',alg:'ECDH',life:5,exposure:3,difficulty:2},{name:'Backup histórico',alg:'AES-256 + RSA',life:25,exposure:1,difficulty:2}];function renderInventory(){const score=s=>Math.min(100,Math.round(s.life*2+s.exposure*15+s.difficulty*10));$('#inventory').innerHTML=systems.sort((a,b)=>score(b)-score(a)).map(s=>{const v=score(s),level=v>=75?'Crítica':v>=55?'Alta':v>=35?'Media':'Baja';return`<tr><td>${s.name}</td><td>${s.alg}</td><td><input data-k="life" data-name="${s.name}" type="number" min="0" max="50" value="${s.life}" style="width:80px"></td><td><select data-k="exposure" data-name="${s.name}"><option value="1" ${s.exposure===1?'selected':''}>Baja</option><option value="2" ${s.exposure===2?'selected':''}>Media</option><option value="3" ${s.exposure===3?'selected':''}>Alta</option></select></td><td><select data-k="difficulty" data-name="${s.name}"><option value="1" ${s.difficulty===1?'selected':''}>Baja</option><option value="2" ${s.difficulty===2?'selected':''}>Media</option><option value="3" ${s.difficulty===3?'selected':''}>Alta</option></select></td><td><b>${level}</b> (${v})</td></tr>`}).join('');$$('#inventory input,#inventory select').forEach(el=>el.onchange=()=>{const s=systems.find(x=>x.name===el.dataset.name);s[el.dataset.k]=+el.value})}$('#recalc').onclick=()=>{renderInventory();setStatus($('#inventoryStatus'),'Prioridades recalculadas según vida del dato, exposición y dificultad de cambio.','good')};updateBits();runBB84();renderInventory();
</script></body></html>
