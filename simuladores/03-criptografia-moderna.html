  <script>

    } = Lab;

    $('#app').innerHTML = nav() + `
      <section class="hero">

        <h1>Criptografía moderna</h1>
        <p>Trabajá con primitivas reales del navegador: SHA-256, PBKDF2, HKDF, AES-GCM y ECDSA. El objetivo no es memorizar nombres, sino comprender propiedades, parámetros, formatos y composición segura.</p>
        <div class="actions"><a class="button" href="modulo-03/ruta-guiada.html">Comenzar Clase 3</a><a class="button secondary" href="modulo-03/contrasena-salt-kdf.html">Profundizar KDF</a><a class="button secondary" href="modulo-03/modos-aes-aead.html">Comparar modos AES</a></div>

      <section class="grid">

          <h2>Efecto avalancha en SHA-256</h2>

            <button id="compareHashes">Comparar hashes</button>
            <button class="secondary" id="flipCharacter">Cambiar un carácter</button>

          <div class="two-col" style="margin-top:14px">
            <div><label>SHA-256(A)</label><div class="output mono" id="hashOutputA"></div></div>
            <div><label>SHA-256(B)</label><div class="output mono" id="hashOutputB"></div></div>
          </div>
          <div class="metric-grid" style="margin-top:14px">
            <div class="metric"><strong id="hashBitDifference">—</strong><span>bits diferentes de 256</span></div>
            <div class="metric"><strong id="hashDifferencePercent">—</strong><span>porcentaje diferente</span></div>
            <div class="metric"><strong id="inputDifference">—</strong><span>posiciones distintas</span></div>
            <div class="metric"><strong id="hashEquality">—</strong><span>hashes iguales</span></div>
          </div>
          <div class="status" id="hashStatus">Un cambio pequeño en la entrada debería producir una salida sin relación visual evidente.</div>
        </article>

        <article class="card full">
          <h2>PBKDF2: derivación desde contraseña</h2>

          <div class="controls">
            <div class="control full"><label>Contraseña ficticia</label><input id="kdfPassword" type="password" value="Clave educativa robusta 2026!" autocomplete="off"></div>
            <div class="control"><label>Iteraciones</label><input id="kdfIterations" type="number" min="10000" max="2000000" value="200000"></div>
            <div class="control"><label>Sal hexadecimal (16 bytes)</label><input id="kdfSalt" class="mono"></div>

            <div class="metric"><strong id="kdfBits">256</strong><span>bits derivados</span></div>
            <div class="metric"><strong id="kdfIterationView">—</strong><span>iteraciones usadas</span></div>

          </div>
          <div class="output mono" id="kdfOutput"></div>
          <div class="status" id="kdfStatus">La sal no necesita ser secreta, pero debe ser única por contraseña.</div>
        </article>

        <article class="card full">
          <h2>AES-GCM: cifrado autenticado y datos asociados</h2>
          <p class="muted">AES-GCM protege el mensaje y autentica datos asociados (AAD) que permanecen visibles. El IV de 96 bits debe ser único para cada clave.</p>
          <div class="controls">
            <div class="control full"><label>Mensaje</label><textarea id="plaintext">Este mensaje será cifrado y autenticado.</textarea></div>
            <div class="control full"><label>Datos asociados AAD</label><input id="aad" value="tipo=orden;version=1;usuario=sergio"></div>
            <div class="control"><label>Contraseña ficticia</label><input id="aesPassword" type="password" value="Clave educativa robusta 2026!" autocomplete="off"></div>
            <div class="control"><label>Iteraciones PBKDF2</label><input id="aesIterations" type="number" min="10000" max="2000000" value="200000"></div>
          </div>
          <div class="actions">
            <button id="encryptAes">Cifrar</button>
            <button class="secondary" id="decryptAes">Descifrar y autenticar</button>
            <button class="danger" id="tamperCiphertext">Alterar criptograma</button>
            <button class="danger" id="tamperAad">Alterar AAD</button>

            <button class="danger" id="tamperTag">Alterar tag</button>
          </div>
          <div class="control" style="margin-top:14px"><label>Paquete JSON interoperable</label><textarea id="aesPackage" class="mono"></textarea></div>
          <div class="two-col" style="margin-top:14px">
            <div><label>Ciphertext sin tag</label><div class="output mono" id="aesCiphertextView"></div></div>

            <div class="metric"><strong id="aesIvBytes">12</strong><span>bytes de IV</span></div>
            <div class="metric"><strong id="aesState">—</strong><span>autenticación</span></div>
          </div>
          <div class="status" id="aesStatus">Cada cifrado genera una sal y un IV nuevos.</div>
        </article>

        <article class="card full">
          <h2>HKDF: separación de claves por contexto</h2>
          <p class="muted">A partir de material secreto con alta entropía, HKDF deriva claves independientes usando etiquetas de contexto. HKDF no reemplaza PBKDF2 o Argon2id para contraseñas humanas.</p>
          <div class="controls">
            <div class="control full"><label>Secreto maestro aleatorio · 32 bytes hexadecimales</label><input id="masterSecret" class="mono" readonly></div>
            <div class="control"><label>Contexto 1</label><input id="hkdfInfoA" value="app:v1:encryption"></div>
            <div class="control"><label>Contexto 2</label><input id="hkdfInfoB" value="app:v1:authentication"></div>
          </div>
          <div class="actions"><button id="deriveHkdf">Derivar claves</button><button class="secondary" id="newMasterSecret">Nuevo secreto maestro</button></div>
          <div class="two-col" style="margin-top:14px">
            <div><label>Clave del contexto 1</label><div class="output mono" id="hkdfOutputA"></div></div>
            <div><label>Clave del contexto 2</label><div class="output mono" id="hkdfOutputB"></div></div>
          </div>
          <div class="status" id="hkdfStatus">Cambiar la etiqueta de contexto debe producir material de clave independiente.</div>
        </article>

        <article class="card full">
          <h2>Firma digital ECDSA y huella de clave pública</h2>
          <p class="muted">La clave privada firma; la pública verifica. La identidad no surge de la matemática por sí sola: debe vincularse la clave pública con una persona, organización o certificado.</p>
          <div class="control"><label>Documento</label><textarea id="signedDocument">Autorizo la operación identificada como TX-2026-001.</textarea></div>
          <div class="actions">
            <button id="generateSigningKeys">Generar par P-256</button>
            <button id="signDocument">Firmar</button>
            <button class="secondary" id="verifySignature">Verificar</button>
            <button class="danger" id="modifyDocument">Modificar documento</button>
          </div>
          <div class="metric-grid" style="margin-top:14px">
            <div class="metric"><strong id="keyState">No</strong><span>par generado</span></div>
            <div class="metric"><strong id="signatureBytes">0</strong><span>bytes de firma</span></div>
            <div class="metric"><strong id="verificationState">—</strong><span>verificación</span></div>
            <div class="metric"><strong id="publicFingerprint">—</strong><span>huella abreviada</span></div>
          </div>
          <div class="two-col" style="margin-top:14px">
            <div><label>Firma Base64</label><div class="output mono" id="signatureOutput"></div></div>
            <div><label>Clave pública JWK</label><div class="output mono" id="publicKeyOutput"></div></div>
          </div>

        </article>

        <article class="card">
          <h2>Objetivos de seguridad</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Primitiva</th><th>Aporta</th><th>No aporta sola</th></tr></thead>
              <tbody>
                <tr><td>Hash</td><td>Resumen, compromiso débil de contenido e integridad comparativa</td><td>Secreto, identidad o autenticación</td></tr>
                <tr><td>KDF</td><td>Derivación y separación de material de clave</td><td>Entropía que la fuente no posee</td></tr>
                <tr><td>AES-GCM</td><td>Confidencialidad, integridad y autenticación del AAD</td><td>Identidad pública del emisor</td></tr>
                <tr><td>ECDSA</td><td>Autenticidad e integridad</td><td>Confidencialidad o vínculo de identidad</td></tr>
              </tbody>
            </table>
          </div>
        </article>

        <article class="card">
          <h2>Desafío</h2>
          <ol class="steps">
            <li>Cifrá dos veces el mismo mensaje y compará sal, IV y criptograma.</li>
            <li>Alterá el AAD sin tocar el criptograma y observá la autenticación.</li>
            <li>Derivá dos claves HKDF cambiando solo una etiqueta.</li>
            <li>Firmá un documento, modificalo y verificá nuevamente.</li>
            <li>Explicá por qué una clave pública válida todavía necesita una política de identidad.</li>
          </ol>
        </article>
      </section>` + footer();

    function assertWebCrypto() {
      if (!globalThis.crypto?.subtle || !globalThis.isSecureContext) {
        throw new Error('Web Crypto requiere HTTPS o localhost. Abrí este laboratorio mediante GitHub Pages.');
      }
    }

    function randomBytes(length) {
      const output = new Uint8Array(length);
      crypto.getRandomValues(output);
      return output;
    }

    function countVisibleDifferences(left, right) {
      const maximum = Math.max(left.length, right.length);
      let count = 0;
      for (let index = 0; index < maximum; index += 1) {
        if (left[index] !== right[index]) count += 1;
      }
      return count;
    }

    async function compareHashMessages() {
      try {
        assertWebCrypto();
        const left = $('#hashMessageA').value;
        const right = $('#hashMessageB').value;
        const hashA = await sha256(left);
        const hashB = await sha256(right);
        const difference = bitDifference(hashA, hashB);

        $('#hashOutputA').textContent = hashA;
        $('#hashOutputB').textContent = hashB;
        $('#hashBitDifference').textContent = difference;
        $('#hashDifferencePercent').textContent = `${(100 * difference / 256).toFixed(1)}%`;
        $('#inputDifference').textContent = countVisibleDifferences(left, right);
        $('#hashEquality').textContent = hashA === hashB ? 'Sí' : 'No';
        setStatus($('#hashStatus'), `Los mensajes difieren en ${countVisibleDifferences(left, right)} posición(es) visibles y sus hashes en ${difference} bits.`, 'good');
      } catch (error) {
        setStatus($('#hashStatus'), error.message, 'bad');
      }
    }

    $('#compareHashes').onclick = compareHashMessages;
    $('#flipCharacter').onclick = () => {
      const value = $('#hashMessageA').value || 'A';
      const last = value.at(-1);
      $('#hashMessageB').value = value.slice(0, -1) + (last === 'A' ? 'B' : 'A');
      compareHashMessages();
    };

    function parseHex(value, expectedLength = null) {
      const normalized = String(value).trim();
      if (!/^(?:[0-9a-fA-F]{2})+$/.test(normalized)) throw new Error('La sal debe ser hexadecimal válida.');
      const bytes = new Uint8Array(normalized.length / 2);
      for (let index = 0; index < bytes.length; index += 1) {
        bytes[index] = Number.parseInt(normalized.slice(index * 2, index * 2 + 2), 16);
      }
      if (expectedLength !== null && bytes.length !== expectedLength) {
        throw new Error(`Se esperaban ${expectedLength} bytes y se recibieron ${bytes.length}.`);
      }
      return bytes;
    }

    async function importPbkdf2Password(password) {
      assertWebCrypto();
      const normalized = String(password).normalize('NFC');
      if (!normalized.length) throw new Error('Ingresá una contraseña ficticia.');
      return crypto.subtle.importKey('raw', te.encode(normalized), 'PBKDF2', false, ['deriveBits', 'deriveKey']);
    }

    async function derivePbkdf2Bits(password, salt, iterations) {
      const keyMaterial = await importPbkdf2Password(password);
      return crypto.subtle.deriveBits(
        { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
        keyMaterial,
        256
      );
    }

    async function deriveAesKey(password, salt, iterations) {
      const keyMaterial = await importPbkdf2Password(password);
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt', 'decrypt']
      );
    }

    $('#newKdfSalt').onclick = () => {
      $('#kdfSalt').value = bytesToHex(randomBytes(16));
    };

    $('#derivePbkdf2').onclick = async () => {
      try {
        const salt = parseHex($('#kdfSalt').value, 16);
        const iterations = Math.max(10000, Math.min(2000000, Number($('#kdfIterations').value)));
        $('#kdfIterations').value = iterations;
        const start = performance.now();
        const bits = await derivePbkdf2Bits($('#kdfPassword').value, salt, iterations);
        const elapsed = performance.now() - start;

        $('#kdfOutput').textContent = bytesToHex(bits);
        $('#kdfTime').textContent = `${elapsed.toFixed(1)} ms`;
        $('#kdfIterationView').textContent = iterations.toLocaleString('es-AR');
        setStatus($('#kdfStatus'), 'Clave derivada. El tiempo depende del dispositivo y debe calibrarse para el entorno real.', 'good');
      } catch (error) {
        setStatus($('#kdfStatus'), error.message, 'bad');
      }
    };

    function validateAesPackage(value) {
      const packet = JSON.parse(value);
      const required = ['v', 'alg', 'kdf', 'iterations', 'salt', 'iv', 'aad', 'ciphertext'];
      for (const field of required) {
        if (!(field in packet)) throw new Error(`Falta el campo ${field}.`);
      }
      if (packet.v !== 1 || packet.alg !== 'AES-256-GCM' || packet.kdf !== 'PBKDF2-SHA-256') {
        throw new Error('Versión o algoritmos no compatibles.');
      }
      if (!Number.isSafeInteger(packet.iterations) || packet.iterations < 10000 || packet.iterations > 2000000) {
        throw new Error('Cantidad de iteraciones inválida.');
      }
      const salt = b64ToBytes(packet.salt);
      const iv = b64ToBytes(packet.iv);
      const ciphertext = b64ToBytes(packet.ciphertext);
      if (salt.length !== 16) throw new Error('La sal debe tener 16 bytes.');
      if (iv.length !== 12) throw new Error('El IV de este perfil debe tener 12 bytes.');
      if (ciphertext.length < 16) throw new Error('El criptograma debe contener al menos el tag de autenticación.');
      return { packet, salt, iv, ciphertext };
    }

    $('#encryptAes').onclick = async () => {
      try {
        assertWebCrypto();
        const salt = randomBytes(16);
        const iv = randomBytes(12);
        const iterations = Math.max(10000, Math.min(2000000, Number($('#aesIterations').value)));
        $('#aesIterations').value = iterations;
        const aadBytes = te.encode($('#aad').value);
        const plaintextBytes = te.encode($('#plaintext').value);
        const key = await deriveAesKey($('#aesPassword').value, salt, iterations);
        const encrypted = await crypto.subtle.encrypt(
          { name: 'AES-GCM', iv, additionalData: aadBytes, tagLength: 128 },
          key,
          plaintextBytes
        );

        const packet = {
          v: 1,
          alg: 'AES-256-GCM',
          kdf: 'PBKDF2-SHA-256',
          iterations,
          salt: bytesToB64(salt),
          iv: bytesToB64(iv),
          aad: bytesToB64(aadBytes),
          ciphertext: bytesToB64(encrypted)
        };

        $('#aesPackage').value = JSON.stringify(packet, null, 2);
        const encryptedBytes = new Uint8Array(encrypted);
        $('#aesCiphertextView').textContent = bytesToHex(encryptedBytes.slice(0, -16));
        $('#aesTagView').textContent = bytesToHex(encryptedBytes.slice(-16));
        $('#decryptedOutput').textContent = '';
        $('#aesPlainBytes').textContent = plaintextBytes.length;
        $('#aesCipherBytes').textContent = encrypted.byteLength;
        $('#aesState').textContent = 'Pendiente';
        setStatus($('#aesStatus'), 'Mensaje cifrado. El paquete conserva ciphertext y tag; la vista los separa para estudiar sus funciones.', 'good');
      } catch (error) {
        setStatus($('#aesStatus'), error.message, 'bad');
      }
    };

    $('#decryptAes').onclick = async () => {
      try {
        assertWebCrypto();
        const { packet, salt, iv, ciphertext } = validateAesPackage($('#aesPackage').value);
        const key = await deriveAesKey($('#aesPassword').value, salt, packet.iterations);
        const plaintext = await crypto.subtle.decrypt(
          {
            name: 'AES-GCM',
            iv,
            additionalData: b64ToBytes(packet.aad),
            tagLength: 128
          },
          key,
          ciphertext
        );
        $('#decryptedOutput').textContent = td.decode(plaintext);
        $('#aesState').textContent = 'Válida';
        setStatus($('#aesStatus'), 'Autenticación válida: contraseña, AAD, IV y criptograma son coherentes.', 'good');
      } catch (error) {
        $('#decryptedOutput').textContent = '';
        $('#aesState').textContent = 'Inválida';
        setStatus($('#aesStatus'), 'No se pudo autenticar o descifrar. Algún componente o la contraseña no coincide.', 'bad');
      }
    };

    $('#tamperCiphertext').onclick = () => {
      try {
        const packet = JSON.parse($('#aesPackage').value);
        const bytes = b64ToBytes(packet.ciphertext);
        bytes[Math.max(0, bytes.length - 3)] ^= 1;
        packet.ciphertext = bytesToB64(bytes);
        $('#aesPackage').value = JSON.stringify(packet, null, 2);
        setStatus($('#aesStatus'), 'Se alteró un bit del criptograma. El descifrado debería rechazar el paquete.', 'warn');
      } catch (error) {
        setStatus($('#aesStatus'), 'Primero generá un paquete válido.', 'bad');
      }
    };

    $('#tamperAad').onclick = () => {
      try {
        const packet = JSON.parse($('#aesPackage').value);
        const aad = td.decode(b64ToBytes(packet.aad)) + ';alterado=1';
        packet.aad = bytesToB64(te.encode(aad));
        $('#aesPackage').value = JSON.stringify(packet, null, 2);
        setStatus($('#aesStatus'), 'Se modificó el AAD. Aunque sea visible, está cubierto por la autenticación.', 'warn');
      } catch (error) {
        setStatus($('#aesStatus'), 'Primero generá un paquete válido.', 'bad');
      }
    };

    $('#tamperIv').onclick = () => {
      try {
        const packet = JSON.parse($('#aesPackage').value);
        const bytes = b64ToBytes(packet.iv);
        bytes[0] ^= 1;
        packet.iv = bytesToB64(bytes);
        $('#aesPackage').value = JSON.stringify(packet, null, 2);
        setStatus($('#aesStatus'), 'Se alteró el IV. En GCM, el nonce también queda cubierto por la verificación del tag.', 'warn');
      } catch (error) {
        setStatus($('#aesStatus'), 'Primero generá un paquete válido.', 'bad');
      }
    };

    $('#tamperTag').onclick = () => {
      try {
        const packet = JSON.parse($('#aesPackage').value);
        const bytes = b64ToBytes(packet.ciphertext);
        if (bytes.length < 16) throw new Error('Tag incompleto.');
        bytes[bytes.length - 1] ^= 1;
        packet.ciphertext = bytesToB64(bytes);
        $('#aesPackage').value = JSON.stringify(packet, null, 2);
        $('#aesTagView').textContent = bytesToHex(bytes.slice(-16));
        setStatus($('#aesStatus'), 'Se alteró un bit del tag. El descifrado autenticado debe rechazar el paquete.', 'warn');
      } catch (error) {
        setStatus($('#aesStatus'), 'Primero generá un paquete válido.', 'bad');
      }
    };

    async function deriveHkdf(info) {
      assertWebCrypto();
      const masterBytes = parseHex($('#masterSecret').value, 32);
      const master = await crypto.subtle.importKey('raw', masterBytes, 'HKDF', false, ['deriveBits']);
      return crypto.subtle.deriveBits(
        {
          name: 'HKDF',
          hash: 'SHA-256',
          salt: te.encode('laboratorio-hkdf-v1'),
          info: te.encode(info)
        },
        master,
        256
      );
    }

    $('#deriveHkdf').onclick = async () => {
      try {
        const infoA = $('#hkdfInfoA').value;
        const infoB = $('#hkdfInfoB').value;
        const [keyA, keyB] = await Promise.all([deriveHkdf(infoA), deriveHkdf(infoB)]);
        const hexA = bytesToHex(keyA);
        const hexB = bytesToHex(keyB);
        $('#hkdfOutputA').textContent = hexA;
        $('#hkdfOutputB').textContent = hexB;
        setStatus(
          $('#hkdfStatus'),
          hexA === hexB
            ? 'Las etiquetas son equivalentes y producen la misma clave. Usá contextos distintos.'
            : 'Las etiquetas distintas produjeron claves distintas a partir del mismo secreto maestro.',
          hexA === hexB ? 'warn' : 'good'
        );
      } catch (error) {
        setStatus($('#hkdfStatus'), error.message, 'bad');
      }
    };

    $('#newMasterSecret').onclick = () => {
      $('#masterSecret').value = bytesToHex(randomBytes(32));
      $('#hkdfOutputA').textContent = '';
      $('#hkdfOutputB').textContent = '';
      setStatus($('#hkdfStatus'), 'Se generó material maestro aleatorio con el CSPRNG del navegador.', 'good');
    };

    let signingKeys = null;
    let signature = null;

    async function exportPublicInformation() {
      const jwk = await crypto.subtle.exportKey('jwk', signingKeys.publicKey);
      const canonical = JSON.stringify({ crv: jwk.crv, kty: jwk.kty, x: jwk.x, y: jwk.y });
      const fingerprint = await sha256(canonical);
      $('#publicKeyOutput').textContent = JSON.stringify(jwk, null, 2);
      $('#publicFingerprint').textContent = fingerprint.slice(0, 16) + '…';
      return fingerprint;
    }

    $('#generateSigningKeys').onclick = async () => {
      try {
        assertWebCrypto();
        signingKeys = await crypto.subtle.generateKey(
          { name: 'ECDSA', namedCurve: 'P-256' },
          true,
          ['sign', 'verify']
        );
        signature = null;
        $('#keyState').textContent = 'Sí';
        $('#verificationState').textContent = '—';
        $('#signatureBytes').textContent = '0';
        $('#signatureOutput').textContent = '';
        await exportPublicInformation();
        setStatus($('#signatureStatus'), 'Par generado. La clave privada permanece dentro de esta sesión del navegador.', 'good');
      } catch (error) {
        setStatus($('#signatureStatus'), error.message, 'bad');
      }
    };

    $('#signDocument').onclick = async () => {
      try {
        if (!signingKeys) await $('#generateSigningKeys').onclick();
        signature = await crypto.subtle.sign(
          { name: 'ECDSA', hash: 'SHA-256' },
          signingKeys.privateKey,
          te.encode($('#signedDocument').value)
        );
        $('#signatureBytes').textContent = signature.byteLength;
        $('#signatureOutput').textContent = bytesToB64(signature);
        $('#verificationState').textContent = 'Pendiente';
        setStatus($('#signatureStatus'), 'Documento firmado. La firma queda vinculada exactamente a estos bytes.', 'good');
      } catch (error) {
        setStatus($('#signatureStatus'), error.message, 'bad');
      }
    };

    $('#verifySignature').onclick = async () => {
      try {
        if (!signingKeys || !signature) throw new Error('Generá el par y firmá el documento primero.');
        const valid = await crypto.subtle.verify(
          { name: 'ECDSA', hash: 'SHA-256' },
          signingKeys.publicKey,
          signature,
          te.encode($('#signedDocument').value)
        );
        $('#verificationState').textContent = valid ? 'Válida' : 'Inválida';
        setStatus(
          $('#signatureStatus'),
          valid
            ? 'Firma válida: documento, firma y clave pública coinciden.'
            : 'Firma inválida: el documento, la firma o la clave pública no coinciden.',
          valid ? 'good' : 'bad'
        );
      } catch (error) {
        setStatus($('#signatureStatus'), error.message, 'bad');
      }
    };

    $('#modifyDocument').onclick = () => {
      $('#signedDocument').value += ' [MODIFICADO]';
      setStatus($('#signatureStatus'), 'Documento modificado después de firmar. Ejecutá la verificación.', 'warn');
    };

    $('#newKdfSalt').click();
    $('#newMasterSecret').click();
    compareHashMessages();
    $('#derivePbkdf2').click();
    $('#encryptAes').click();
    $('#deriveHkdf').click();
    $('#generateSigningKeys').click();
  </script>
</body>
</html>
