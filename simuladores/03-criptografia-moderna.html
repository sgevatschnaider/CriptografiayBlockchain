<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criptografía moderna</title><link rel="stylesheet" href="assets/lab.css"></head><body><main class="shell" id="app"></main><script src="assets/lab.js"></script><script>
const {nav,footer,$,sha256,bitDifference,bytesToB64,b64ToBytes,te,td,setStatus}=Lab;$('#app').innerHTML=nav()+`<section class="hero"><div class="eyebrow">Módulo 3</div><h1>Criptografía moderna</h1><p>Trabajá con primitivas reales disponibles en el navegador: SHA‑256, derivación de claves, cifrado autenticado AES‑GCM y firmas ECDSA. El laboratorio enfatiza objetivos de seguridad y composición correcta.</p></section><section class="grid"><article class="card full"><h2>Efecto avalancha en SHA‑256</h2><div class="two-col"><div class="control"><label>Mensaje A</label><textarea id="hashA">La criptografía protege información.</textarea></div><div class="control"><label>Mensaje B</label><textarea id="hashB">La criptografía protege informacion.</textarea></div></div><div class="actions"><button id="runHash">Comparar hashes</button></div><div class="two-col" style="margin-top:14px"><div><label>SHA‑256(A)</label><div class="output mono" id="hashAOut"></div></div><div><label>SHA‑256(B)</label><div class="output mono" id="hashBOut"></div></div></div><div class="metric-grid" style="margin-top:14px"><div class="metric"><strong id="bitDiff">—</strong><span>bits diferentes de 256</span></div><div class="metric"><strong id="diffPct">—</strong><span>porcentaje diferente</span></div><div class="metric"><strong>256</strong><span>bits de salida</span></div><div class="metric"><strong>64</strong><span>dígitos hexadecimales</span></div></div><div class="status" id="hashStatus">Un cambio mínimo debería producir una salida sin relación visual evidente.</div></article><article class="card full"><h2>Cifrado autenticado AES‑GCM</h2><p class="muted">Se deriva una clave AES‑256 desde una contraseña mediante PBKDF2. El paquete incluye sal, vector de inicialización y criptograma. GCM protege confidencialidad e integridad.</p><div class="controls"><div class="control full"><label>Mensaje</label><textarea id="plain">Este mensaje será cifrado y autenticado.</textarea></div><div class="control"><label>Contraseña</label><input id="password" type="password" value="Clave educativa robusta 2026!"></div><div class="control"><label>Iteraciones PBKDF2</label><input id="iterations" type="number" min="1000" value="150000"></div></div><div class="actions"><button id="encrypt">Cifrar</button><button class="secondary" id="decrypt">Descifrar paquete</button><button class="danger" id="tamper">Alterar criptograma</button></div><div class="control" style="margin-top:14px"><label>Paquete JSON</label><textarea id="package" class="mono"></textarea></div><div class="output" id="decrypted"></div><div class="status" id="aesStatus">Cada cifrado genera una sal y un IV nuevos.</div></article><article class="card full"><h2>Firma digital ECDSA</h2><p class="muted">El navegador genera un par de claves P‑256. La clave privada firma; la pública verifica. Modificar el documento invalida la firma.</p><div class="control"><label>Documento</label><textarea id="document">Autorizo la operación identificada como TX-2026-001.</textarea></div><div class="actions"><button id="generateKeys">Generar par de claves</button><button id="sign">Firmar</button><button class="secondary" id="verify">Verificar</button><button class="danger" id="modifyDoc">Modificar documento</button></div><div class="metric-grid" style="margin-top:14px"><div class="metric"><strong id="keyState">No</strong><span>par generado</span></div><div class="metric"><strong id="sigBytes">0</strong><span>bytes de firma</span></div><div class="metric"><strong id="verifyState">—</strong><span>verificación</span></div><div class="metric"><strong>P‑256</strong><span>curva didáctica</span></div></div><div class="output mono" id="signatureOut"></div><div class="status" id="signatureStatus">La firma no cifra el documento: autentica origen e integridad.</div></article><article class="card"><h2>Objetivos de seguridad</h2><div class="table-wrap"><table><thead><tr><th>Primitiva</th><th>Aporta</th><th>No aporta por sí sola</th></tr></thead><tbody><tr><td>Hash</td><td>Resumen e integridad comparativa</td><td>Secreto o identidad</td></tr><tr><td>AES‑GCM</td><td>Confidencialidad e integridad</td><td>Identidad pública del emisor</td></tr><tr><td>Firma digital</td><td>Autenticidad e integridad</td><td>Confidencialidad</td></tr><tr><td>KDF</td><td>Clave derivada y endurecimiento</td><td>Calidad de una contraseña débil</td></tr></tbody></table></div></article><article class="card"><h2>Desafío</h2><ol class="steps"><li>Cifrá dos veces el mismo mensaje y compará los paquetes.</li><li>Alterá un byte y observá el fallo de autenticación.</li><li>Firmá un documento, cambialo y verificá nuevamente.</li><li>Explicá por qué hash, cifrado y firma no son intercambiables.</li></ol></article></section>`+footer();
async function runHash(){const a=await sha256($('#hashA').value),b=await sha256($('#hashB').value),d=bitDifference(a,b);$('#hashAOut').textContent=a;$('#hashBOut').textContent=b;$('#bitDiff').textContent=d;$('#diffPct').textContent=(d/256*100).toFixed(1)+'%';setStatus($('#hashStatus'),`Los mensajes difieren en ${Math.max($('#hashA').value.length,$('#hashB').value.length)-[...$('#hashA').value].filter((c,i)=>c===$('#hashB').value[i]).length} posiciones visibles y en ${d} bits del hash.`,'good')}
async function derive(password,salt,iterations){const base=await crypto.subtle.importKey('raw',te.encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
$('#encrypt').onclick=async()=>{try{const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),iterations=Math.max(1000,+$('#iterations').value),key=await derive($('#password').value,salt,iterations),cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode($('#plain').value));const pack={v:1,alg:'AES-256-GCM',kdf:'PBKDF2-SHA-256',iterations,salt:bytesToB64(salt),iv:bytesToB64(iv),ciphertext:bytesToB64(cipher)};$('#package').value=JSON.stringify(pack,null,2);$('#decrypted').textContent='';setStatus($('#aesStatus'),'Mensaje cifrado. El tag de autenticación está incluido en el criptograma.','good')}catch(e){setStatus($('#aesStatus'),e.message,'bad')}};
$('#decrypt').onclick=async()=>{try{const p=JSON.parse($('#package').value),salt=b64ToBytes(p.salt),iv=b64ToBytes(p.iv),cipher=b64ToBytes(p.ciphertext),key=await derive($('#password').value,salt,p.iterations),plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,cipher);$('#decrypted').textContent=td.decode(plain);setStatus($('#aesStatus'),'Autenticación válida: el paquete no fue alterado y la contraseña es correcta.','good')}catch(e){$('#decrypted').textContent='';setStatus($('#aesStatus'),'No se pudo autenticar o descifrar. Contraseña incorrecta, paquete alterado o formato inválido.','bad')}};
$('#tamper').onclick=()=>{try{const p=JSON.parse($('#package').value),b=b64ToBytes(p.ciphertext);b[Math.max(0,b.length-3)]^=1;p.ciphertext=bytesToB64(b);$('#package').value=JSON.stringify(p,null,2);setStatus($('#aesStatus'),'Se alteró un bit. Intentá descifrar para observar la detección.','warn')}catch(e){setStatus($('#aesStatus'),'Primero generá un paquete válido.','bad')}};
let keys=null,signature=null;$('#generateKeys').onclick=async()=>{keys=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);signature=null;$('#keyState').textContent='Sí';$('#verifyState').textContent='—';$('#signatureOut').textContent='';setStatus($('#signatureStatus'),'Par de claves generado dentro del navegador.','good')};
$('#sign').onclick=async()=>{if(!keys)await $('#generateKeys').onclick();signature=await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},keys.privateKey,te.encode($('#document').value));$('#sigBytes').textContent=signature.byteLength;$('#signatureOut').textContent=bytesToB64(signature);$('#verifyState').textContent='Pendiente';setStatus($('#signatureStatus'),'Documento firmado. La firma depende exactamente de su contenido.','good')};
$('#verify').onclick=async()=>{if(!keys||!signature){setStatus($('#signatureStatus'),'Generá claves y firma primero.','warn');return}const ok=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},keys.publicKey,signature,te.encode($('#document').value));$('#verifyState').textContent=ok?'Válida':'Inválida';setStatus($('#signatureStatus'),ok?'Firma válida: contenido y clave pública coinciden.':'Firma inválida: el contenido, la firma o la clave no coinciden.',ok?'good':'bad')};
$('#modifyDoc').onclick=()=>{$('#document').value+=' [MODIFICADO]';setStatus($('#signatureStatus'),'Documento modificado después de la firma. Verificá nuevamente.','warn')};$('#runHash').onclick=runHash;runHash();$('#encrypt').click();
</script></body></html>
