<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fundamentos matemáticos de la criptografía</title><link rel="stylesheet" href="assets/lab.css"></head><body><main class="shell" id="app"></main><script src="assets/lab.js"></script><script>
const {nav,footer,$,mod,gcd,egcd,powMod,entropyOfText,isProbablePrime,setStatus}=Lab;$('#app').innerHTML=nav()+`<section class="hero"><div class="eyebrow">Módulo 2</div><h1>Fundamentos matemáticos</h1><p>Explorá las estructuras que convierten operaciones simples en problemas útiles para la seguridad: congruencias, inversos, exponenciación modular, intercambio de claves y entropía.</p></section><section class="grid"><article class="card"><h2>Aritmética modular</h2><div class="controls"><div class="control"><label>a</label><input id="a" type="number" value="37"></div><div class="control"><label>b</label><input id="b" type="number" value="12"></div><div class="control"><label>Módulo n</label><input id="n" type="number" min="2" value="26"></div><div class="control"><label>Operación</label><select id="op"><option value="add">a + b</option><option value="sub">a − b</option><option value="mul">a × b</option><option value="pow">a^b</option></select></div></div><div class="actions"><button id="calcMod">Calcular</button></div><div class="output mono" id="modOut"></div><div class="status" id="modStatus">Dos enteros son congruentes módulo n cuando dejan el mismo resto.</div></article><article class="card"><h2>Máximo común divisor e inverso</h2><div class="controls"><div class="control"><label>Número a</label><input id="invA" type="number" value="7"></div><div class="control"><label>Módulo n</label><input id="invN" type="number" value="26"></div></div><div class="actions"><button id="runInv">Ejecutar Euclides extendido</button></div><div class="metric-grid" style="margin-top:14px"><div class="metric"><strong id="gcdVal">—</strong><span>mcd(a,n)</span></div><div class="metric"><strong id="xVal">—</strong><span>Coeficiente x</span></div><div class="metric"><strong id="yVal">—</strong><span>Coeficiente y</span></div><div class="metric"><strong id="inverseVal">—</strong><span>Inverso modular</span></div></div><div class="status" id="invStatus">El inverso existe únicamente cuando mcd(a,n)=1.</div></article><article class="card full"><h2>Intercambio Diffie–Hellman didáctico</h2><p class="muted">Alice y Bob publican valores derivados de secretos privados. Ambos llegan a la misma clave compartida sin transmitirla directamente.</p><div class="controls"><div class="control"><label>Primo p</label><input id="p" type="number" value="23"></div><div class="control"><label>Generador g</label><input id="g" type="number" value="5"></div><div class="control"><label>Secreto de Alice a</label><input id="privA" type="number" value="6"></div><div class="control"><label>Secreto de Bob b</label><input id="privB" type="number" value="15"></div></div><div class="actions"><button id="runDH">Simular intercambio</button><button class="secondary" id="randomDH">Generar secretos</button></div><div class="metric-grid" style="margin-top:14px"><div class="metric"><strong id="pubA">—</strong><span>A = gᵃ mod p</span></div><div class="metric"><strong id="pubB">—</strong><span>B = gᵇ mod p</span></div><div class="metric"><strong id="sharedA">—</strong><span>Bᵃ mod p</span></div><div class="metric"><strong id="sharedB">—</strong><span>Aᵇ mod p</span></div></div><div class="output mono" id="dhTrace"></div><div class="status" id="dhStatus">Los números pequeños son inseguros; sirven solo para visualizar el protocolo.</div></article><article class="card"><h2>Entropía de Shannon</h2><div class="control"><label>Secuencia</label><textarea id="entropyText">ABRACADABRA</textarea></div><div class="actions"><button id="runEntropy">Medir entropía</button></div><div class="metric-grid" style="margin-top:14px"><div class="metric"><strong id="hSymbol">—</strong><span>bits por símbolo</span></div><div class="metric"><strong id="hTotal">—</strong><span>bits estimados</span></div><div class="metric"><strong id="alphabetSize">—</strong><span>símbolos distintos</span></div><div class="metric"><strong id="hMax">—</strong><span>máximo posible</span></div></div><div class="status" id="entropyStatus">La entropía estadística no equivale automáticamente a seguridad criptográfica.</div></article><article class="card"><h2>Mapa conceptual</h2><div class="table-wrap"><table><thead><tr><th>Estructura</th><th>Uso</th></tr></thead><tbody><tr><td>Grupos finitos</td><td>Diffie–Hellman, firmas, curvas elípticas</td></tr><tr><td>Cuerpos finitos</td><td>AES, códigos y operaciones algebraicas</td></tr><tr><td>Problemas difíciles</td><td>Factorización, logaritmo discreto, retículas</td></tr><tr><td>Probabilidad</td><td>Seguridad semántica, aleatoriedad y pruebas</td></tr><tr><td>Entropía</td><td>Fuentes de claves, nonces y secretos</td></tr></tbody></table></div></article><article class="card full"><h2>Desafío integrador</h2><ol class="steps"><li>Encontrá todos los números entre 1 y 25 que tienen inverso módulo 26.</li><li>Explicá por qué un cifrado afín exige que su multiplicador sea coprimo con 26.</li><li>Cambiá p por un número compuesto en Diffie–Hellman y analizá qué supuesto se rompe.</li><li>Compará la entropía de una secuencia uniforme con otra altamente repetitiva.</li></ol></article></section>`+footer();
$('#calcMod').onclick=()=>{const a=+$('#a').value,b=+$('#b').value,n=+$('#n').value;if(n<2){setStatus($('#modStatus'),'El módulo debe ser al menos 2.','bad');return}let raw,label;switch($('#op').value){case'add':raw=a+b;label=`${a}+${b}`;break;case'sub':raw=a-b;label=`${a}-${b}`;break;case'mul':raw=a*b;label=`${a}×${b}`;break;default:raw=powMod(a,b,n);label=`${a}^${b}`;$('#modOut').textContent=`${label} mod ${n} = ${raw}`;setStatus($('#modStatus'),'La exponenciación modular evita construir números gigantes.','good');return}$('#modOut').textContent=`${label} = ${raw}\n${raw} mod ${n} = ${mod(raw,n)}`;setStatus($('#modStatus'),`${raw} y ${mod(raw,n)} pertenecen a la misma clase de congruencia módulo ${n}.`,'good')};
$('#runInv').onclick=()=>{const a=+$('#invA').value,n=+$('#invN').value;const r=egcd(a,n);$('#gcdVal').textContent=r.g;$('#xVal').textContent=r.x;$('#yVal').textContent=r.y;$('#inverseVal').textContent=r.g===1?mod(r.x,n):'No existe';setStatus($('#invStatus'),r.g===1?`${a}·${mod(r.x,n)} ≡ 1 (mod ${n}).`:`Como mcd(${a},${n})=${r.g}, no existe inverso.`,r.g===1?'good':'warn')};
function runDH(){const p=+$('#p').value,g=+$('#g').value,a=+$('#privA').value,b=+$('#privB').value;if(p<3||a<1||b<1){setStatus($('#dhStatus'),'Revisá los parámetros.','bad');return}const A=powMod(g,a,p),B=powMod(g,b,p),sA=powMod(B,a,p),sB=powMod(A,b,p);$('#pubA').textContent=A;$('#pubB').textContent=B;$('#sharedA').textContent=sA;$('#sharedB').textContent=sB;$('#dhTrace').textContent=`Datos públicos: p=${p}, g=${g}, A=${A}, B=${B}\nSecretos privados: a=${a}, b=${b}\nAlice calcula B^a mod p = ${sA}\nBob calcula A^b mod p = ${sB}`;setStatus($('#dhStatus'),`${isProbablePrime(p)?'p parece primo para este rango.':'Advertencia: p no es primo.'} Las claves compartidas ${sA===sB?'coinciden':'no coinciden'}.`,sA===sB&&isProbablePrime(p)?'good':'warn')}
$('#runDH').onclick=runDH;$('#randomDH').onclick=()=>{const p=+$('#p').value;$('#privA').value=Lab.randomInt(2,Math.max(2,p-2));$('#privB').value=Lab.randomInt(2,Math.max(2,p-2));runDH()};
$('#runEntropy').onclick=()=>{const text=$('#entropyText').value,h=entropyOfText(text),k=new Set(text).size,hmax=k?Math.log2(k):0;$('#hSymbol').textContent=h.toFixed(3);$('#hTotal').textContent=(h*text.length).toFixed(2);$('#alphabetSize').textContent=k;$('#hMax').textContent=hmax.toFixed(3);setStatus($('#entropyStatus'),hmax&&h/hmax>.9?'La distribución es relativamente uniforme.':'La repetición reduce la incertidumbre estadística.',hmax&&h/hmax>.9?'good':'warn')};$('#calcMod').click();$('#runInv').click();runDH();$('#runEntropy').click();
</script></body></html>
