;(function seleccionarSimulacion() {
  let intentos = 0;
  function seleccionar() {
    const botones = Array.from(document.querySelectorAll('.lab-sidebar nav button'));
    const boton = botones.find((item) => item.querySelector('b')?.textContent?.trim() === "Minería y prueba de trabajo");
    if (!boton) {
      if (intentos++ < 80) window.setTimeout(seleccionar, 25);
      return;
    }
    boton.click();
    document.title = "Minería y prueba de trabajo | Laboratorio Interactivo de Bitcoin";
    document.body.classList.add('simulacion-individual');
    const marca = document.querySelector('.brand small');
    if (marca) marca.textContent = 'Simulación individual vinculada con los PPT';
    const tituloLateral = document.querySelector('.sidebar-intro b');
    if (tituloLateral) tituloLateral.textContent = "Minería y prueba de trabajo";
    const textoLateral = document.querySelector('.sidebar-intro p');
    if (textoLateral) textoLateral.textContent = "Búsqueda de un hash bajo el target";
    botones.forEach((item) => { if (item !== boton) item.style.display = 'none'; });
    document.querySelectorAll('.lab-sidebar nav').forEach((nav) => {
      if (!nav.contains(boton)) nav.style.display = 'none';
    });
    const siguiente = document.querySelector('.next-lab');
    if (siguiente) siguiente.style.display = 'none';
    window.scrollTo({ top: 0, behavior: 'instant' });
  }
  window.setTimeout(seleccionar, 0);
})();</script>
