name: Validar y publicar simuladores

on:
  pull_request:
    paths:
      - 'simuladores/**'
      - 'docs/criptografia/**'
      - 'scripts/validate-*.mjs'
      - '.github/workflows/pages.yml'
      - 'index.html'
      - 'README.md'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validar sitio estático
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar HTML, JavaScript, enlaces locales y programa moderno
        run: |
          node scripts/validate-simulators.mjs
          node scripts/validate-module-02.mjs
          node scripts/validate-module-03.mjs
          node scripts/validate-fundamentos-matematicos.mjs
          node scripts/validate-modern-program.mjs
          node scripts/validate-vernam-integration.mjs
          node scripts/validate-aes-integration.mjs

  deploy:
    name: Publicar GitHub Pages
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Subir sitio estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
